name: Price source check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Save sample Google Finance pages to the debug branch
        run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          mkdir out && cd out
          curl -s -A "$UA" -H "Accept-Language: en-US,en;q=0.9" -o bel.html "https://www.google.com/finance/quote/BEL:NSE?hl=en"
          curl -s -A "$UA" -H "Accept-Language: en-US,en;q=0.9" -o nifty.html "https://www.google.com/finance/quote/NIFTY_50:INDEXNSE?hl=en"
          curl -s -A "$UA" -H "Accept-Language: en-US,en;q=0.9" -o bel_beta.html "https://www.google.com/finance/beta/quote/BEL:NSE?hl=en"
          ls -la
          git init -q -b debug
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "debug pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" debug
